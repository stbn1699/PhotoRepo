services:
  db:
    image: postgres:17-alpine
    container_name: photorepo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: photorepo
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
      POSTGRES_DB: photorepo
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      # Via le réseau (127.0.0.1) : pendant l'initialisation, Postgres n'écoute que localement.
      test: ["CMD-SHELL", "pg_isready -U photorepo -h 127.0.0.1"]
      interval: 5s
      retries: 10

  app:
    build: .
    container_name: photorepo-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://photorepo:${DB_PASSWORD}@db:5432/photorepo
      SITE_NAME: ${SITE_NAME:-Galerie}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SCAN_INTERVAL_MINUTES: ${SCAN_INTERVAL_MINUTES:-5}
    volumes:
      # Le lecteur Photographie, en lecture seule : le site ne modifie jamais tes photos.
      - ${PHOTOS_PATH:?PHOTOS_PATH manquant dans .env}:/photos:ro
    ports:
      - "${APP_PORT:-8080}:3000"
